services:
  postgres:
    image: postgres:16-alpine
    container_name: coursehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: courserecommend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d courserecommend" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./code/backend
      dockerfile: Dockerfile
    container_name: coursehub-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/courserecommend
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: password123
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
